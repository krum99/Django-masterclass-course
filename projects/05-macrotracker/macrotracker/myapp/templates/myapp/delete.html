<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Item — Luxe UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: { sans: ["Inter", "ui-sans-serif", "system-ui"] },
            colors: {
              brand: {
                500: "#6366f1",
              },
            },
            boxShadow: {
              glass: "0 8px 24px rgba(15,23,42,.12)",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center px-4"
  >
    <div
      class="relative max-w-md w-full rounded-3xl border border-white/10 bg-white/5 backdrop-blur-md p-8 shadow-glass"
    >
      <h1 class="text-2xl font-bold mb-4">Confirm Deletion</h1>
      <p class="text-slate-300 mb-6">
        Are you sure you want to delete this item? This action cannot be undone.
      </p>
      <form method="POST" class="flex items-center gap-3">
        {% csrf_token %}
        <button
          type="submit"
          class="flex-1 rounded-2xl px-4 py-3 font-semibold bg-gradient-to-tr from-red-600 to-pink-500 hover:from-red-500 hover:to-pink-400 text-white shadow-glass transition"
        >
          Yes, delete
        </button>
        <a
          href="javascript:history.back()"
          class="flex-1 text-center rounded-2xl px-4 py-3 font-semibold bg-white/10 hover:bg-white/15 text-slate-100 border border-white/10 shadow-glass transition"
          >Cancel</a
        >
      </form>
    </div>
  </body>
</html>
