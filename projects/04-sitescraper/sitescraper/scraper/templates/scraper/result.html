<!DOCTYPE html>
<html lang="en">
  <head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-12 m-5">
          <h1>Link Collector</h1>
        </div>
      </div>
      <div class="row m-5">
        <form method="POST" action="/" class="row">
          {% csrf_token %}
          <div class="col-md-4">
            <input class="form-control" type="text" name="site" id="site" placeholder="enter site address" />
          </div>
          <div class="col-md-2">
            <button class="btn btn-primary" type="submit">Scrape</button>
          </div>
        </form>
        <div class="col-md-6">
          <a class="btn btn-warning" href="/delete">Delete</a>
        </div>
      </div>
      <div class="row">
        <div class="col-md-8">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Name</th>
                <th scope="col">Link</th>
              </tr>
            </thead>
            <tbody>
              {% for link in data %}
                <tr>
                  <td>{{ link.id }}</td>
                  <td>{{ link.name }}</td>
                  <td>{{ link.address }}</td>
                </tr>
              {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
